name: Android SDK & Demo

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build SDK AAR + Demo APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :novaperf-sdk:assembleRelease :demo:assembleDebug --console=plain --stacktrace

      - name: Verify artifacts
        run: |
          ls -lh android/novaperf-sdk/build/outputs/aar/*.aar
          ls -lh android/demo/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: novaperf-android
          path: |
            android/novaperf-sdk/build/outputs/aar/*.aar
            android/demo/build/outputs/apk/debug/*.apk
