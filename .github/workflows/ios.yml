name: iOS Swift Package

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  # 每次提交都跑：Linux 上的 Swift 语法校验（无需 macOS runner，秒级反馈）
  swift-syntax:
    runs-on: ubuntu-latest
    # 直接用官方 Swift 镜像：setup-swift@v2 在 ubuntu-24.04 上找不到 5.9 工具链会 404
    container:
      image: swift:5.9
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Parse all Swift sources
        run: |
          find ios/Sources ios/Tests -name '*.swift' -print0 | xargs -0 swiftc -parse
          echo "Swift 语法校验通过"

  # 完整编译/单测/iOS Simulator 构建：需 macOS runner。
  # 该账号的 macOS runner 曾出现 "macos-14-arm64-us-default is not supported"，
  # macos-13 虽被接受但长时间排队，因此改为手动触发（Actions → Run workflow），
  # 避免每次 push 挂一个永不执行的排队任务。
  macos-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-13
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Swift build (macOS)
        working-directory: ios
        run: swift build -c release

      - name: Unit tests (schema / writer / null contract)
        working-directory: ios
        run: swift test

      - name: Build for iOS Simulator
        working-directory: ios
        run: |
          xcodebuild -scheme NovaPerf \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator -configuration Release \
            CODE_SIGNING_ALLOWED=NO build
